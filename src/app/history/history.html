<div class="history-page fade-in">
  <h1>History</h1>
  <p class="subtitle">All your past submissions in one place.</p>

  <div class="history-card">
    <div class="toolbar">
      <div class="search-box">
        <i class="ti ti-search"></i>
        <input
          type="text"
          placeholder="Search by job ID or service..."
          [value]="searchQuery()"
          (input)="onSearch($event)"
        />
      </div>

      <button class="filter-btn" type="button">
        <i class="ti ti-filter"></i>
        All statuses
      </button>
    </div>

    <div class="table">
      <div class="table-header">
        <span>JOB ID</span>
        <span>DATE</span>
        <span>SERVICES</span>
        <span>STATUS</span>
        <span>ACTION</span>
      </div>

      @for (job of jobs(); track job.id) {
        <div class="table-row" (click)="viewJob(job)">
          <span class="job-id">{{ job.id }}</span>
          <span>{{ formatDate(job.createdAt) }}</span>
          <span class="services">{{ formatServices(job.selectedServices) }}</span>
          <span>
            <span class="status" [ngClass]="job.status">
              <span class="status-dot"></span>
              {{ getStatusLabel(job.status) }}
            </span>
          </span>
          <span>
            <button class="view-btn" type="button" (click)="viewJob(job, $event)">
              <i class="ti ti-eye"></i>
              View Job
            </button>
          </span>
        </div>
      }
    </div>
  </div>
</div>
