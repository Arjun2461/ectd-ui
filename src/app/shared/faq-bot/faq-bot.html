<!-- Floating launcher + friendly nudge -->
<div class="fab-wrap">
  <div class="nudge-bubble" *ngIf="showNudge && !isOpen" role="status">
    <span class="nudge-bubble__icon" aria-hidden="true">
      <span class="bot-logo bot-logo--nudge">
        <span class="bot-logo__head">
          <span class="bot-logo__eye"></span>
          <span class="bot-logo__eye"></span>
          <span class="bot-logo__smile"></span>
        </span>
      </span>
    </span>
    <span class="nudge-bubble__text">{{ nudgeMessage }}</span>
    <span class="nudge-bubble__tail" aria-hidden="true"></span>
  </div>

  <button
    class="fab"
    [class.fab--open]="isOpen"
    (click)="toggle()"
    (mouseenter)="onFabHover()"
    [attr.aria-label]="isOpen ? 'Close help chat' : 'Open help chat'"
    [attr.aria-expanded]="isOpen"
  >
    <span class="fab__pulse" *ngIf="!isOpen && hasUnread"></span>

    <span class="fab__icon" *ngIf="!isOpen">
      <span class="bot-logo bot-logo--fab" aria-hidden="true">
        <span class="bot-logo__antenna"></span>
        <span class="bot-logo__head">
          <span class="bot-logo__eye"></span>
          <span class="bot-logo__eye"></span>
          <span class="bot-logo__smile"></span>
        </span>
      </span>
    </span>

    <span class="fab__icon fab__icon--close" *ngIf="isOpen">
      <lucide-icon [img]="X"></lucide-icon>
    </span>
  </button>
</div>

<!-- Chat panel -->
<div class="chat-panel" *ngIf="isOpen" role="dialog" aria-label="eCTD Help Assistant">
  <div class="chat-header">
    <div class="chat-header__glow"></div>
    <div class="chat-header__avatar">
      <span class="bot-logo bot-logo--header" aria-hidden="true">
        <span class="bot-logo__antenna"></span>
        <span class="bot-logo__head">
          <span class="bot-logo__eye"></span>
          <span class="bot-logo__eye"></span>
          <span class="bot-logo__smile"></span>
        </span>
      </span>
    </div>
    <div class="chat-header__title">
      <h4>eCTD Assistant</h4>
      <p>
        <span class="status-dot"></span>
        {{ isTyping ? 'Typing…' : 'Online' }}
      </p>
    </div>
    <button class="chat-header__close" (click)="close()" aria-label="Close chat">
      <lucide-icon [img]="X"></lucide-icon>
    </button>
  </div>

  <div class="chat-body">
    <ng-container *ngFor="let msg of messages; trackBy: trackMessage; let mi = index">
      <div
        class="row msg-enter"
        [class.row--user]="msg.from === 'user'"
        [style.animation-delay.ms]="mi * 30"
      >
        <div class="avatar avatar--bot" *ngIf="msg.from === 'bot'">
          <span class="bot-logo bot-logo--xs" aria-hidden="true">
            <span class="bot-logo__head">
              <span class="bot-logo__eye"></span>
              <span class="bot-logo__eye"></span>
            </span>
          </span>
        </div>

        <div
          class="bubble"
          [class.bubble--bot]="msg.from === 'bot'"
          [class.bubble--user]="msg.from === 'user'"
        >
          {{ msg.text }}
        </div>
      </div>

      <!-- Main menu -->
      <div class="menu-grid msg-enter" *ngIf="msg.showMenu" [style.animation-delay.ms]="mi * 30 + 60">
        <button
          class="menu-card"
          *ngFor="let branch of faqTree; let ci = index"
          (click)="selectBranch(branch)"
          [style.animation-delay.ms]="ci * 40"
        >
          <span class="menu-card__icon">{{ branch.icon }}</span>
          <span class="menu-card__text">
            <span class="menu-card__title">{{ branch.title }}</span>
            <span class="menu-card__hint">{{ branch.items.length }} Q&A</span>
          </span>
          <span class="menu-card__arrow-wrap">
            <lucide-icon [img]="ChevronRight"></lucide-icon>
          </span>
        </button>
      </div>

      <!-- Suggestion chips -->
      <div
        class="suggestions msg-enter"
        *ngIf="msg.suggestions?.length && !msg.showMenu"
        [style.animation-delay.ms]="mi * 30 + 70"
      >
        <button
          class="suggestion-chip"
          *ngFor="let s of msg.suggestions; let si = index"
          [class.suggestion-chip--action]="s === mainMenuLabel || s === closeLabel"
          [class.suggestion-chip--close]="s === closeLabel"
          (click)="onSuggestionClick(s)"
          [style.animation-delay.ms]="si * 35"
        >
          <span class="suggestion-chip__icon-wrap" *ngIf="s === mainMenuLabel">
            <lucide-icon [img]="Home"></lucide-icon>
          </span>
          <span>{{ s }}</span>
        </button>
      </div>
    </ng-container>

    <!-- Typing indicator -->
    <div class="row typing-row msg-enter" *ngIf="isTyping">
      <div class="avatar avatar--bot">
        <span class="bot-logo bot-logo--xs" aria-hidden="true">
          <span class="bot-logo__head">
            <span class="bot-logo__eye bot-logo__eye--blink"></span>
            <span class="bot-logo__eye bot-logo__eye--blink"></span>
          </span>
        </span>
      </div>
      <div class="bubble bubble--bot typing-bubble">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
    </div>

    <div #scrollAnchor></div>
  </div>

  <div class="chat-input">
    <input
      type="text"
      placeholder="Type a question…"
      [(ngModel)]="draft"
      (keyup.enter)="onSend()"
      [disabled]="isTyping"
    />
    <button
      class="send-btn"
      (click)="onSend()"
      [disabled]="!draft.trim() || isTyping"
      aria-label="Send message"
    >
      <lucide-icon [img]="Send"></lucide-icon>
    </button>
  </div>
</div>
