<div class="translation-card">
  <div class="translation-top">
    <div class="translation-icon">
      <i class="ti ti-language" aria-hidden="true"></i>
    </div>

    <div class="translation-titles">
      <strong>Translation Output</strong>
      <p>Dossier translated across regulatory languages</p>
    </div>
  </div>

  <div class="translation-body">
    <div class="tl-stat-grid">
      <div class="tl-stat">
        <span class="tl-num">{{ stats.pages }}</span>
        <span class="tl-lbl">Documents translated</span>
      </div>
      <div class="tl-stat">
        <span class="tl-num">{{ stats.languages }}</span>
        <span class="tl-lbl">Languages</span>
      </div>
    </div>

    <div class="tl-lang-list">
      @for (lang of languagesList; track lang.name) {
        <div class="tl-lang-row">
          <span class="tl-lang-name">{{ lang.name }}</span>
          <span
            class="tl-lang-status"
            [class.complete]="lang.status === 'Complete'"
          >
            {{ lang.status }}
          </span>

          <!-- Glossary CSV download -->
          <button
            type="button"
            class="svc-download-btn svc-download-btn--compact svc-download-btn--ghost"
            [attr.aria-label]="'Download ' + lang.name + ' glossary CSV'"
            (click)="downloadGlossary(lang)"
          >
            <i class="ti ti-file-spreadsheet" aria-hidden="true"></i>
            Glossary
          </button>

          <!-- Translated PDF ZIP download -->
          <button
            type="button"
            class="svc-download-btn svc-download-btn--compact"
            [attr.aria-label]="'Download ' + lang.name + ' translated PDF'"
            (click)="downloadTranslatedPdf(lang)"
          >
            <i class="ti ti-download" aria-hidden="true"></i>
            PDF
          </button>
        </div>
      }
    </div>
  </div>
</div>
